name: Desktop binaries

on:
  push:
    branches: [main, develop]
    tags: ['v[0-9]*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            binary: defender
            rustflags: ''
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: defender.exe
            rustflags: '-C target-feature=+crt-static'
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Test target
        run: cargo test --locked --all-targets --target ${{ matrix.target }}

      - name: Test packaging
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Build release binary
        run: cargo build --locked --release --bin defender --target ${{ matrix.target }}

      - name: Check release binary from an empty directory
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          $binary = Join-Path $env:GITHUB_WORKSPACE "target/$env:TARGET/release/$env:BINARY"
          Set-Location $env:RUNNER_TEMP
          & $binary --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $binary --actor-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $binary --actor-attract-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check macOS WGPU rendering
        if: runner.os == 'macOS'
        run: target/${{ matrix.target }}/release/defender --actor-wgpu-smoke

      - name: Package binary and checksum
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $version = "dev-$($env:GITHUB_SHA.Substring(0, 12))"
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME }
          python scripts/package_release.py --target $env:TARGET --version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload downloadable package
        uses: actions/upload-artifact@v6
        with:
          name: defender-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v7
        with:
          pattern: defender-*
          merge-multiple: true
          path: dist

      - name: Verify packages and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check ./*.sha256
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Defender $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" ./* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
